[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaadhamma"
version = "1.0.0"
description = "Yaadhamma — voice-driven personal assistant for macOS, built on LiveKit Agents"
requires-python = ">=3.10, <3.15"

dependencies = [
    "pypdf>=5",
    "livekit-agents[google,images]>=1.8.3,<1.9",
    "livekit-plugins-ai-coustics~=0.2",
    "livekit-plugins-openai>=1.8.3,<1.9",
    "openai>=2.54.0",
    "playwright>=1.62.0",
    "python-dotenv",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Optional: the always-on wake-word daemon (v1 Stage 3). These stay out of the
# base install because the assistant works fine without them; the daemon
# fails with an actionable message when one is missing.
[project.optional-dependencies]
wake = [
    "openwakeword>=0.6.0",  # default "hey jarvis" engine
    "sounddevice>=0.4.0",  # microphone capture
    "numpy>=1.24",
    "pynput>=1.7.0",  # Option+Space shortcut
    # pvporcupine is intentionally NOT here: Picovoice discontinued its free
    # tier in June 2026 (enterprise only). The porcupine code path in
    # src/wake.py still works behind YAADHAMMA_WAKE_ENGINE=porcupine for an
    # enterprise key — install pvporcupine separately in that case.
    # onnxruntime dropped macOS x86_64 (Intel) wheels after 1.23.x; pin the
    # last good one there so `uv sync --extra wake` works on Intel Macs.
    # Apple Silicon and Linux keep resolving the latest.
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
ui = [
    "rumps>=0.4.0",  # menu-bar item (pulls in pyobjc on macOS)
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
